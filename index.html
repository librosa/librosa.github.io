<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting to librosa documentation</title>
    <link rel="canonical" href="https://librosa.org/doc/">
    <meta http-equiv="refresh" content="0; url=https://librosa.org/doc/">
    <script>
      window.location.replace("https://librosa.org/doc/" + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://librosa.org/doc/">https://librosa.org/doc/</a>...</p>
  </body>
</html>
